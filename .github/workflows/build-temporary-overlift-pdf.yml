name: Temporary Overlift PDF Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'overlift-nes-master-handoff.tex'
      - 'pdf-build-trigger.txt'

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Compile LaTeX handoff
        id: compile
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: overlift-nes-master-handoff.tex

      - name: Normalize PDF filename
        if: always()
        shell: bash
        run: |
          if [ -f overlift-nes-master-handoff.pdf ]; then
            mv overlift-nes-master-handoff.pdf Overlift-NES-Master-Engineering-Handoff.pdf
          fi

      - name: Upload compiled PDF artifact
        if: ${{ hashFiles('Overlift-NES-Master-Engineering-Handoff.pdf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Overlift-NES-Master-Engineering-Handoff
          path: Overlift-NES-Master-Engineering-Handoff.pdf
          if-no-files-found: error

      - name: Commit PDF or diagnostics to PR branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f Overlift-NES-Master-Engineering-Handoff.pdf ]; then
            git add Overlift-NES-Master-Engineering-Handoff.pdf
          fi
          if [ -f overlift-nes-master-handoff.log ]; then
            cp overlift-nes-master-handoff.log Overlift-NES-Master-Engineering-Handoff-build.log
            git add Overlift-NES-Master-Engineering-Handoff-build.log
          fi
          git commit -m "Store Overlift NES PDF build result" || true
          git push origin HEAD:${{ github.head_ref }}
          test -f Overlift-NES-Master-Engineering-Handoff.pdf
